      .accent { stroke: #00E5FF; }
      .title { fill: #FFFFFF; font-family: system-ui, -apple-system, sans-serif; font-size: 36px; font-weight: 700; letter-spacing: 2px; }
      .meta { fill: #9AA0A6; font-family: ui-monospace, Menlo, monospace; font-size: 20px; letter-spacing: 4px; }
      @media (prefers-color-scheme: light) {
